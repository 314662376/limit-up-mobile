<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#f4f5f7" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f2f3f5'/%3E%3Cpolyline points='5,23 11,14 17,18 27,8' fill='none' stroke='%232f6bd8' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<title>打板</title>
<style>
  :root{
    --bg:#f2f3f5;
    --card:#ffffff;
    --line:#e8eaed;
    --txt:#1f2329;
    --sub:#8a9099;
    --up:#d93025;      /* 涨 / 强 */
    --down:#0f9d58;    /* 跌 / 弱 */
    --flat:#8a9099;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap{max-width:520px;margin:0 auto;padding:10px 10px 18px;}

  /* ---- 三个数字 ---- */
  .nums{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    display:flex;align-items:stretch;padding:14px 6px 11px;
  }
  .nums .cell{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px;}
  .nums .cell+.cell{border-left:1px solid var(--line);}
  .nums .v{
    font-size:clamp(21px,8.4vw,34px);font-weight:700;line-height:1.05;
    font-variant-numeric:tabular-nums;letter-spacing:-.6px;white-space:nowrap;
  }
  .nums .k{font-size:11px;color:var(--sub);letter-spacing:.4px;white-space:nowrap;}
  .v.up{color:var(--up);}
  .v.down{color:var(--down);}
  .v.flat{color:var(--flat);}
  .v.stale{opacity:.62;}

  /* ---- 视图切换 ---- */
  .tabs{display:flex;justify-content:center;gap:8px;margin:10px 0 8px;}
  .tabs button{
    font:inherit;font-size:13px;line-height:1;color:var(--sub);
    background:var(--card);border:1px solid var(--line);border-radius:999px;
    padding:7px 20px;cursor:pointer;
  }
  .tabs button.on{color:#fff;background:#2f6bd8;border-color:#2f6bd8;font-weight:600;}

  /* ---- 两条线 ---- */
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    margin-bottom:9px;padding:4px 2px 2px;overflow:hidden;
  }
  .chart{width:100%;height:clamp(168px,27vh,232px);}
  .legend{
    display:flex;flex-wrap:wrap;gap:4px 12px;
    padding:0 12px 6px;font-size:11px;color:var(--sub);
    font-variant-numeric:tabular-nums;
  }
  .legend:empty{display:none;}
  .legend span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;}
  .legend i{width:9px;height:3px;border-radius:2px;display:inline-block;}
  .legend span b{color:var(--txt);font-weight:600;}
  .hint{padding:0 12px 8px;font-size:11px;line-height:1.6;color:var(--sub);}
  .hint:empty{display:none;}

  /* ---- 底部一行 ---- */
  .foot{
    display:flex;align-items:center;justify-content:center;gap:7px;
    font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums;
    padding-top:3px;
  }
  .foot .dot{width:6px;height:6px;border-radius:50%;background:#0f9d58;flex:none;}
  .foot .dot.err{background:#d93025;}
  .foot .sep{opacity:.45;}
</style>
</head>
<body>
<div class="wrap">

  <!-- 三个数字：情绪指数 / 打板收益 / 今日实时封板率 -->
  <div class="nums">
    <div class="cell"><b class="v flat" id="curValue">--</b><span class="k">情绪指数</span></div>
    <div class="cell"><b class="v flat" id="curValue2">--</b><span class="k">打板收益</span></div>
    <div class="cell"><b class="v flat" id="curRate">--</b><span class="k">封板率</span></div>
  </div>

  <!-- 两条线：① 涨停情绪指数 / ② 打板收益 -->
  <div class="tabs" id="viewTabs">
    <button type="button" data-v="1d">1日</button>
    <button type="button" data-v="5d">5日</button>
  </div>

  <div class="card">
    <div class="chart" id="chartMain"></div>
    <div class="legend" id="legendMain"></div>
    <div class="hint" id="hintMain"></div>
  </div>

  <div class="card">
    <div class="chart" id="chart2"></div>
    <div class="legend" id="legend2"></div>
    <div class="hint" id="hint2"></div>
  </div>

  <div class="foot">
    <span class="dot" id="liveDot"></span>
    <span id="liveText">…</span>
    <span class="sep">·</span>
    <span id="localTime">--</span>
  </div>

</div>

<script src="lib/echarts.min.js"></script>
<script src="app.js"></script>
</body>
</html>
